name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run licences
      - run: npm audit --audit-level=moderate
      - run: npm run build

# Not run here, honestly: the browser suites need a real GPU with WebGPU, which GitHub's runners
# do not have. Run them locally: npm run test:gpu (kernels against the CPU reference),
# npm run test:ui (the page in Chromium), npm run test:browsers (Chromium, WebKit, Firefox).
